<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />
    <title>Agri-Drone GCS Map</title>
    <style>
        html, body, #map { width:100%; height:100%; margin:0; padding:0; background:#1e1e1e; }
        .leaflet-div-icon { background:transparent !important; border:none !important; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div id="map"></div>
    <div id="progress-hud" style="position:absolute;top:12px;right:12px;z-index:1000;background:rgba(15,15,15,0.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;width:250px;color:#fff;font-family:'Segoe UI',sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.6);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-weight:700;font-size:13px;color:#FFD700;letter-spacing:.5px;">AGRI-TITAN</span>
            <span id="hud-status" style="font-size:9px;font-weight:700;background:#007bff;color:#fff;padding:2px 8px;border-radius:10px;text-transform:uppercase;">READY</span>
        </div>
        <div style="font-size:11px;color:#999;margin-bottom:4px;display:flex;justify-content:space-between;">
            <span>Mission Progress</span><span id="progress-text" style="color:#28a745;font-weight:700;">0%</span>
        </div>
        <div style="background:rgba(255,255,255,0.08);height:5px;border-radius:3px;margin-bottom:10px;overflow:hidden;">
            <div id="progress-bar" style="background:linear-gradient(90deg,#28a745,#00e676);width:0%;height:100%;transition:width .4s;border-radius:3px;"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:10px;border-top:1px solid rgba(255,255,255,0.06);padding-top:8px;">
            <div><span style="color:#666;">Work WPs</span><br/><span id="checkpoint-text" style="font-weight:700;font-size:12px;">0 / 0</span></div>
            <div><span style="color:#666;">Est. Time</span><br/><span id="time-text" style="font-weight:700;font-size:12px;">--</span></div>
            <div><span style="color:#666;">Completed</span><br/><span id="dist-done" style="font-weight:700;font-size:12px;color:#28a745;">0 m</span></div>
            <div><span style="color:#666;">Remaining</span><br/><span id="dist-left" style="font-weight:700;font-size:12px;color:#fd7e14;">0 m</span></div>
        </div>
    </div>

    <script>
        var map, droneMarker, waypointMarkers = [], pathLine, completedLine, landingMarker;
        var allWaypoints = []; // {lat, lon, index, cmd, marker}
        var userInteracting = false, userTimer = null;
        var missionComplete = false;

        // Haversine distance in meters
        function haversine(lat1, lon1, lat2, lon2) {
            var R = 6371000;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Hexacopter SVG
        var hexSvg =
            '<svg width="70" height="70" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
            '<circle cx="50" cy="50" r="46" fill="none" stroke="#28A745" stroke-width="1" stroke-dasharray="4 3" opacity=".3"/>' +
            '<line x1="50" y1="50" x2="50" y2="16" stroke="#111" stroke-width="4" stroke-linecap="round"/>' +
            '<line x1="50" y1="50" x2="79.4" y2="33" stroke="#111" stroke-width="4" stroke-linecap="round"/>' +
            '<line x1="50" y1="50" x2="79.4" y2="67" stroke="#111" stroke-width="4" stroke-linecap="round"/>' +
            '<line x1="50" y1="50" x2="50" y2="84" stroke="#111" stroke-width="4" stroke-linecap="round"/>' +
            '<line x1="50" y1="50" x2="20.6" y2="67" stroke="#111" stroke-width="4" stroke-linecap="round"/>' +
            '<line x1="50" y1="50" x2="20.6" y2="33" stroke="#111" stroke-width="4" stroke-linecap="round"/>' +
            '<line x1="50" y1="50" x2="50" y2="16" stroke="#FF4500" stroke-width="1.5" stroke-linecap="round"/>' +
            '<line x1="50" y1="50" x2="79.4" y2="33" stroke="#FF4500" stroke-width="1" stroke-linecap="round"/>' +
            '<line x1="50" y1="50" x2="20.6" y2="33" stroke="#FF4500" stroke-width="1" stroke-linecap="round"/>' +
            '<ellipse cx="50" cy="16" rx="11" ry="3" fill="#FF4500" opacity=".45" transform="rotate(0,50,16)"/>' +
            '<ellipse cx="50" cy="16" rx="11" ry="3" fill="#FF4500" opacity=".45" transform="rotate(90,50,16)"/>' +
            '<ellipse cx="79.4" cy="33" rx="11" ry="3" fill="#FF4500" opacity=".4" transform="rotate(60,79.4,33)"/>' +
            '<ellipse cx="79.4" cy="33" rx="11" ry="3" fill="#FF4500" opacity=".4" transform="rotate(150,79.4,33)"/>' +
            '<ellipse cx="20.6" cy="33" rx="11" ry="3" fill="#FF4500" opacity=".4" transform="rotate(-60,20.6,33)"/>' +
            '<ellipse cx="20.6" cy="33" rx="11" ry="3" fill="#FF4500" opacity=".4" transform="rotate(30,20.6,33)"/>' +
            '<ellipse cx="79.4" cy="67" rx="11" ry="3" fill="#ccc" opacity=".35" transform="rotate(-60,79.4,67)"/>' +
            '<ellipse cx="79.4" cy="67" rx="11" ry="3" fill="#ccc" opacity=".35" transform="rotate(30,79.4,67)"/>' +
            '<ellipse cx="50" cy="84" rx="11" ry="3" fill="#ccc" opacity=".35" transform="rotate(0,50,84)"/>' +
            '<ellipse cx="50" cy="84" rx="11" ry="3" fill="#ccc" opacity=".35" transform="rotate(90,50,84)"/>' +
            '<ellipse cx="20.6" cy="67" rx="11" ry="3" fill="#ccc" opacity=".35" transform="rotate(60,20.6,67)"/>' +
            '<ellipse cx="20.6" cy="67" rx="11" ry="3" fill="#ccc" opacity=".35" transform="rotate(150,20.6,67)"/>' +
            '<circle cx="50" cy="16" r="5" fill="#FF4500" stroke="#fff" stroke-width="1.2"/>' +
            '<circle cx="79.4" cy="33" r="5" fill="#FF4500" stroke="#fff" stroke-width="1.2"/>' +
            '<circle cx="20.6" cy="33" r="5" fill="#FF4500" stroke="#fff" stroke-width="1.2"/>' +
            '<circle cx="79.4" cy="67" r="5" fill="#333" stroke="#fff" stroke-width="1.2"/>' +
            '<circle cx="50" cy="84" r="5" fill="#333" stroke="#fff" stroke-width="1.2"/>' +
            '<circle cx="20.6" cy="67" r="5" fill="#333" stroke="#fff" stroke-width="1.2"/>' +
            '<polygon points="42,38 58,38 64,50 58,62 42,62 36,50" fill="#1a1a1a" stroke="#fff" stroke-width="1.5"/>' +
            '<rect x="43" y="40" width="14" height="18" rx="2" fill="#2a2a2a" stroke="#555" stroke-width=".6"/>' +
            '<rect x="44.5" y="43" width="11" height="13" rx="1" fill="#00bcd4" opacity=".7"/>' +
            '<rect x="47" y="38.5" width="6" height="2" rx=".5" fill="#FF4500"/>' +
            '<path d="M50 4 L44 14 L56 14 Z" fill="#FF4500" stroke="#fff" stroke-width=".8"/>' +
            '</svg>';

        var droneIcon = L.divIcon({
            html: '<div id="drone-element" style="transition:transform .15s linear;display:flex;flex-direction:column;align-items:center;width:80px;height:80px;">' +
                  '<div style="color:#FFD700;background:rgba(10,10,10,.9);font-size:7.5px;font-weight:700;font-family:Segoe UI,sans-serif;padding:1px 5px;border-radius:3px;margin-bottom:1px;border:.5px solid #FFD700;white-space:nowrap;">AGRI-TITAN</div>' +
                  hexSvg + '</div>',
            iconSize: [80, 80], iconAnchor: [40, 40]
        });

        function createWpIcon(n, color) {
            var bg = color || '#fd7e14';
            return L.divIcon({
                html: '<div style="background:' + bg + ';color:#fff;border:2px solid #fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:Segoe UI,sans-serif;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.5);">' + n + '</div>',
                iconSize: [24, 24], iconAnchor: [12, 12]
            });
        }

        window.onload = function() {
            map = L.map('map', { zoomControl: true, attributionControl: false }).setView([22.5600287, 72.9202776], 17);
            L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 22, maxNativeZoom: 20 }).addTo(map);
            droneMarker = L.marker([22.5600287, 72.9202776], { icon: droneIcon }).addTo(map);
            pathLine = L.polyline([], { color: '#fd7e14', weight: 3, opacity: 0.7, dashArray: '8 4' }).addTo(map);
            completedLine = L.polyline([], { color: '#28a745', weight: 4, opacity: 0.95 }).addTo(map);

            // Detect user interaction to free map
            map.on('mousedown', function() { userInteracting = true; clearTimeout(userTimer); });
            map.on('dragstart', function() { userInteracting = true; clearTimeout(userTimer); });
            map.on('zoomstart', function() { userInteracting = true; clearTimeout(userTimer); });
            map.on('mouseup', resetUserTimer);
            map.on('dragend', resetUserTimer);
            map.on('zoomend', resetUserTimer);
        };

        function resetUserTimer() {
            clearTimeout(userTimer);
            userTimer = setTimeout(function() { userInteracting = false; }, 5000);
        }

        function updateDrone(lat, lon, heading) {
            droneMarker.setLatLng([lat, lon]);
            var el = document.getElementById("drone-element");
            if (el) el.style.transform = "rotate(" + heading + "deg)";
            if (!userInteracting && !missionComplete) {
                map.panTo([lat, lon], { animate: true, duration: 0.5 });
            }
        }

        function clearWaypoints() {
            for (var i = 0; i < waypointMarkers.length; i++) map.removeLayer(waypointMarkers[i]);
            waypointMarkers = []; allWaypoints = [];
            pathLine.setLatLngs([]); completedLine.setLatLngs([]);
            if (landingMarker) { map.removeLayer(landingMarker); landingMarker = null; }
            missionComplete = false;
            updateMissionProgress(0, 0, "Standby", 0);
        }

        // cmd: 16=WAYPOINT, 22=TAKEOFF, 21=LAND, 20=RTL
        function addWaypoint(lat, lon, index, cmd) {
            var isWork = (cmd == 16); // Only NAV_WAYPOINT is work
            var color = isWork ? '#fd7e14' : '#888';
            var m = L.marker([lat, lon], { icon: createWpIcon(index, color) }).addTo(map);
            waypointMarkers.push(m);
            allWaypoints.push({ lat: lat, lon: lon, index: index, cmd: cmd, marker: m });
            if (lat != 0 && lon != 0) pathLine.addLatLng([lat, lon]);
            if (waypointMarkers.length > 1) map.fitBounds(new L.featureGroup(waypointMarkers).getBounds().pad(0.15));
        }

        // Calculate total work distance (only between NAV_WAYPOINT commands, skip takeoff/land)
        function getWorkSegments() {
            var workWps = [];
            for (var i = 0; i < allWaypoints.length; i++) {
                if (allWaypoints[i].cmd == 16 && allWaypoints[i].lat != 0) workWps.push(allWaypoints[i]);
            }
            var segments = [];
            var totalDist = 0;
            for (var i = 1; i < workWps.length; i++) {
                var d = haversine(workWps[i-1].lat, workWps[i-1].lon, workWps[i].lat, workWps[i].lon);
                totalDist += d;
                segments.push({ from: workWps[i-1], to: workWps[i], dist: d, cumDist: totalDist, wpIndex: workWps[i].index });
            }
            return { segments: segments, totalDist: totalDist, workWps: workWps };
        }

        // speed in m/s from C#
        function updateMissionProgress(currentWp, totalWpRaw, statusStr, groundSpeed) {
            var h = document.getElementById("hud-status");
            if (h) {
                h.innerText = statusStr.toUpperCase();
                h.style.background = statusStr.toUpperCase().indexOf("ACTIVE") >= 0 ? "#28a745" : statusStr.toUpperCase().indexOf("READY") >= 0 ? "#007bff" : statusStr.toUpperCase().indexOf("LOST") >= 0 ? "#dc3545" : "#fd7e14";
            }

            var work = getWorkSegments();
            var totalDist = work.totalDist;
            var workWps = work.workWps;
            var segments = work.segments;

            // Find completed distance based on current waypoint index
            var completedDist = 0;
            var completedWpCount = 0;
            var completedCoords = [];

            if (workWps.length > 0) completedCoords.push([workWps[0].lat, workWps[0].lon]);

            for (var i = 0; i < segments.length; i++) {
                if (currentWp > segments[i].wpIndex || (currentWp >= segments[i].wpIndex && statusStr.toUpperCase().indexOf("ACTIVE") < 0)) {
                    // This segment is completed when we've passed its target waypoint
                }
                if (segments[i].wpIndex <= currentWp) {
                    completedDist += segments[i].dist;
                    completedWpCount++;
                    completedCoords.push([segments[i].to.lat, segments[i].to.lon]);
                }
            }

            var remainingDist = totalDist - completedDist;
            if (remainingDist < 0) remainingDist = 0;

            var percent = totalDist > 0 ? Math.min(Math.round((completedDist / totalDist) * 100), 100) : 0;

            // Color waypoints: completed=green, pending=orange, non-work=grey
            for (var i = 0; i < allWaypoints.length; i++) {
                var wp = allWaypoints[i];
                var col = '#888'; // non-work
                if (wp.cmd == 16) {
                    col = wp.index <= currentWp ? '#28a745' : '#fd7e14';
                }
                wp.marker.setIcon(createWpIcon(wp.index, col));
            }

            // Draw completed path in green
            completedLine.setLatLngs(completedCoords);

            // Estimate time remaining
            var speed = groundSpeed > 0.5 ? groundSpeed : 3.0; // default 3 m/s if no speed data
            var etaSec = remainingDist / speed;
            var etaStr = etaSec > 60 ? (etaSec / 60).toFixed(1) + " min" : Math.round(etaSec) + " sec";

            // Check mission complete
            if (percent >= 100 && allWaypoints.length > 0) {
                missionComplete = true;
                if (!landingMarker) {
                    var last = allWaypoints[allWaypoints.length - 1];
                    landingMarker = L.marker([last.lat, last.lon], {
                        icon: L.divIcon({
                            html: '<div style="background:#dc3545;color:#fff;border:2px solid #fff;border-radius:4px;padding:2px 6px;font-weight:700;font-family:Segoe UI,sans-serif;font-size:10px;box-shadow:0 2px 6px rgba(0,0,0,.5);white-space:nowrap;">LANDING</div>',
                            iconSize: [60, 20], iconAnchor: [30, 10]
                        })
                    }).addTo(map);
                }
            }

            // Format distances
            var doneStr = completedDist > 1000 ? (completedDist/1000).toFixed(2) + " km" : Math.round(completedDist) + " m";
            var leftStr = remainingDist > 1000 ? (remainingDist/1000).toFixed(2) + " km" : Math.round(remainingDist) + " m";

            document.getElementById("progress-text").innerText = percent + "%";
            document.getElementById("progress-bar").style.width = percent + "%";
            document.getElementById("checkpoint-text").innerText = completedWpCount + " / " + workWps.length;
            document.getElementById("time-text").innerText = percent >= 100 ? "DONE" : etaStr;
            document.getElementById("dist-done").innerText = doneStr;
            document.getElementById("dist-left").innerText = leftStr;
        }
    </script>
</body>
</html>
